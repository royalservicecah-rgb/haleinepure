<!doctype html><html lang="fr"><meta charset="utf-8"><title>Contrôle mobile HaleinePure</title><style>body{margin:0;background:#e8ecef;font:14px Arial}nav{position:sticky;top:0;padding:12px;background:white;display:flex;gap:8px;flex-wrap:wrap}button{padding:10px}iframe{display:block;height:844px;margin:20px auto;border:0;background:white}pre{padding:12px;white-space:pre-wrap}</style><nav><button onclick="resize(360)">360 px</button><button onclick="resize(390)">390 px</button><button onclick="resize(412)">412 px</button><button onclick="resize(768)">768 px</button><button onclick="resize(1280)">1280 px</button><button onclick="mode='error';report()">Réponse erreur simulée</button><button onclick="mode='success';report()">Réponse succès simulée</button><button onclick="report()">Contrôler images et largeur</button><button onclick="reset()">Recommencer</button></nav><iframe title="Tunnel mobile" id="screen" width="390" src="/?utm_source=facebook&utm_campaign=qa-local&fbclid=qa-local#offres"></iframe><pre id="result"></pre><script>let mode='error',calls=[];const frame=document.getElementById('screen');function resize(w){frame.width=w;report()}function reset(){calls=[];frame.src='/?utm_source=facebook&utm_campaign=qa-local&fbclid=qa-local&t='+Date.now()}function report(){const w=frame.contentWindow,d=w.document;document.getElementById('result').textContent=JSON.stringify({width:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,mode,images:[...d.images].map(i=>({src:i.getAttribute('src'),loaded:i.complete&&i.naturalWidth>0})),calls},null,2)}frame.addEventListener('load',()=>{const w=frame.contentWindow,original=w.fetch.bind(w);w.fetch=async(url,opts)=>{if(String(url).includes('public-order-haleinepure')){const f=JSON.parse(opts.body);calls.push(f);report();await new Promise(r=>setTimeout(r,1200));return new w.Response(JSON.stringify(mode==='success'?{ok:true,order:{customer_name:f.name,order_number:'QA-SIMULÉE',quantity:f.quantity,commune:f.commune,total:f.quantity===3?12000:f.quantity===2?10000:f.zone==='abidjan'?6000:7000,payment_method:f.zone==='abidjan'?'Paiement à la livraison':'Paiement avant expédition'}}:{ok:false}),{status:mode==='success'?200:503,headers:{'Content-Type':'application/json'}})}return original(url,opts)};report()});</script></html>
